services:
  - type: web
    name: industrias-cin
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && node scripts/render-build.js
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: INITIAL_USER_PASSWORD
        generateValue: true
      - key: NEXT_PUBLIC_APP_NAME
        value: Industrias CIN
      - key: NEXT_PUBLIC_APP_TAGLINE
        value: Bebidas No Carbonatadas (Hervidos y Jugos)
      - key: NEXT_PUBLIC_ENABLE_DEMO_ROLE_SWITCHER
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: industrias-cin-db
          property: connectionString

databases:
  - name: industrias-cin-db
    plan: free
    region: oregon
    databaseName: industrias_cin
    user: cin_admin
